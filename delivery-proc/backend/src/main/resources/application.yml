server:
  shutdown: graceful
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:delivery;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: true
  sql:
    init:
      mode: always
      continue-on-error: false
  lifecycle:
    timeout-per-shutdown-phase: 1m

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
